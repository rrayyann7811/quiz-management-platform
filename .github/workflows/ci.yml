name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: quiz_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d quiz_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quiz_platform_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quiz_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run generate -w backend
      - run: npm run migrate -w backend
      - run: npm exec -w backend -- prisma migrate status
      - run: npm test
      - run: npm run build
