name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/quiz_platform_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/quiz_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Start disposable PostgreSQL on runner loopback
        run: |
          docker run --detach --name quiz-ci-postgres --network host \
            --env POSTGRES_DB=quiz_platform_test --env POSTGRES_PASSWORD=postgres \
            postgres:18 -c listen_addresses=127.0.0.1 -p 55432
          for attempt in {1..30}; do
            if docker exec quiz-ci-postgres pg_isready -h 127.0.0.1 -p 55432 -U postgres -d quiz_platform_test; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: npm ci --include=dev
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run generate -w backend
      - run: npm run migrate -w backend
      - run: npm exec -w backend -- prisma migrate status
      - run: npm test
      - run: npm run build
